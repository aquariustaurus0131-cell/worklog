<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>每日工作日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Palette: light-blue ground, blue→violet gradient for actions, pale violet for selection.
   Layout: four tabs (記錄 / 今天 / 統計 / 總覽) behind a bottom tab bar; borderless soft panels, spacing does the grouping. */
:root {
  --bg: #EDF4FB;
  --surface: #FFFFFF;
  --sunk: #EEF3FA;
  --ink: #2A3550;
  --muted: #7680A0;
  --faint: #A8B1C7;
  --line: #E1E8F2;
  --accent: #8A7FD4;
  --grad: linear-gradient(135deg, #7DB0E2, #A895DC);
  --sel-bg: #ECE6FA;
  --sel-ink: #5A4A9C;
  --danger: #C2566A;
  --neg: #E3958A; --mid: #C3CAD8; --pos: #7CC1A6;
  --neg-ink: #B5513F; --pos-ink: #2B8061;
  --p1: #8FB3E0; --p2: #B3A3DD; --p3: #8CC5BF; --p4: #E1AECB; --p5: #E5C493; --p6: #A7B4CC;
  --skip: #C3CAD8;
  --hl: #E6DEF7;
  --shadow: 0 1px 2px rgba(42, 53, 80, .04), 0 4px 16px rgba(42, 53, 80, .05);
  --f-body: "Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Nunito", "Noto Sans TC", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A29; --surface: #1C2336; --sunk: #242C42; --ink: #E5E9F5; --muted: #9AA3BE; --faint: #646E89;
    --line: #2C3550; --accent: #B2A8F0;
    --grad: linear-gradient(135deg, #5A8FC6, #8E7ACC);
    --sel-bg: #383061; --sel-ink: #E2D9FF;
    --danger: #EC8A9B; --neg: #D9897E; --mid: #4E5873; --pos: #6CB89C; --neg-ink: #F0A194; --pos-ink: #7FD6B5;
    --p1: #7C9CC9; --p2: #9C8CC6; --p3: #79AFA9; --p4: #C597B2; --p5: #C9AB7E; --p6: #8F9BB3;
    --skip: #4E5873; --hl: #4A3F78;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141A29; --surface: #1C2336; --sunk: #242C42; --ink: #E5E9F5; --muted: #9AA3BE; --faint: #646E89;
  --line: #2C3550; --accent: #B2A8F0;
  --grad: linear-gradient(135deg, #5A8FC6, #8E7ACC);
  --sel-bg: #383061; --sel-ink: #E2D9FF;
  --danger: #EC8A9B; --neg: #D9897E; --mid: #4E5873; --pos: #6CB89C; --neg-ink: #F0A194; --pos-ink: #7FD6B5;
  --p1: #7C9CC9; --p2: #9C8CC6; --p3: #79AFA9; --p4: #C597B2; --p5: #C9AB7E; --p6: #8F9BB3;
  --skip: #4E5873; --hl: #4A3F78;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 16px; padding-block: 4px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
.warn { font-size: 13px; color: var(--danger); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { font-size: 20px; font-weight: 800; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.runpill { font-family: var(--f-num); font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; padding: 3px 11px; background: var(--grad); color: #FFFFFF; display: inline-flex; align-items: center; gap: 6px; }
.runpill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.datenav { display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.datenav button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--muted); }
.datenav button:hover { background: var(--sunk); color: var(--ink); }
.datenav .d { min-width: 104px; text-align: center; font-weight: 700; }
.datenav .today-btn { width: auto; padding-inline: 10px; font-size: 13px; border-radius: 999px; color: var(--sel-ink); background: var(--sel-bg); }

/* tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in oklab, var(--surface) 92%, transparent); backdrop-filter: blur(10px); box-shadow: 0 -1px 0 var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 9px; font-size: 12px; font-weight: 600; color: var(--faint); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); }
.page { display: flex; flex-direction: column; gap: 18px; }

/* panels */
.panel { background: var(--surface); border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 20px; box-shadow: var(--shadow); }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ph h2, .ph h3 { margin: 0; font-size: 18px; font-weight: 800; }
.edit-flag { font-size: 12px; font-weight: 700; color: var(--sel-ink); background: var(--sel-bg); padding: 2px 10px; border-radius: 999px; }
h4 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }

/* summary */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border-radius: 20px; padding: 14px 8px; box-shadow: var(--shadow); }
.stat { padding-inline: 8px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--f-num); font-size: 24px; font-weight: 800; line-height: 1.2; }
.stat .v small { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: 2px; font-weight: 600; }
.other { font-size: 12px; color: var(--muted); }

/* timer */
.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.timer .tinfo { display: flex; flex-direction: column; min-width: 0; }
.timer .clock { font-family: var(--f-num); font-weight: 800; font-size: 15px; color: var(--muted); }
.timer.on { background: var(--sel-bg); border-radius: 16px; padding: 12px 14px; }
.timer.on .clock { font-size: 30px; line-height: 1.1; color: var(--sel-ink); }
.timer .tsub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.timer .tbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.tbtn { border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; background: var(--grad); color: #FFFFFF; font-size: 14px; }
.tbtn.quiet { background: transparent; color: var(--muted); font-weight: 600; }

/* fields */
.field { display: flex; flex-direction: column; gap: 10px; }
.label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 700; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid transparent; background: var(--sunk); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; line-height: 1.3; display: inline-flex; align-items: center; gap: 7px; transition: background .12s, color .12s; }
.chip:hover { background: color-mix(in oklab, var(--sel-bg) 60%, var(--sunk)); }
.chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); flex: none; }
.chip.add { background: transparent; border: 1px dashed var(--faint); color: var(--muted); }
.chips.editing .chip:not(.add):not([aria-pressed="true"]) { border-color: var(--faint); border-style: dashed; background: transparent; }
.archbox { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--sunk); }
.archbox .chip:not([aria-pressed="true"]) { background: var(--surface); color: var(--muted); }
.mpanel { display: flex; flex-direction: column; gap: 8px; }
.mtitle { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
.mbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.mb { border: 0; background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.mb.danger { color: var(--danger); }
.mb.quiet { color: var(--muted); background: transparent; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; font: inherit; padding: 7px 14px; border: 1px solid var(--accent); border-radius: 999px; background: var(--surface); color: var(--ink); }
.addrow button { border: 0; border-radius: 999px; padding: 7px 16px; background: var(--grad); color: #FFFFFF; font-weight: 700; }

/* time */
.timebox { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; align-items: center; gap: 6px; }
.timebox input { font-family: var(--f-num); font-size: 16px; font-weight: 700; padding: 8px 6px; border: 0; border-radius: 12px; background: var(--sunk); color: var(--ink); width: 100%; min-width: 0; }
.timebox .arrow { color: var(--faint); }
.timebox .durv { font-family: var(--f-num); font-size: 16px; font-weight: 800; color: var(--sel-ink); background: var(--sel-bg); padding: 3px 12px; border-radius: 999px; }
.tlinks { display: flex; gap: 14px; flex-wrap: wrap; }
.tlinks button { border: 0; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; }

/* mood */
.moodhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.moodval { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.moodval .big { font-family: var(--f-num); font-size: 26px; font-weight: 800; line-height: 1; color: var(--mc); }
.moodval .word { font-size: 13px; color: var(--muted); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.switch .knob { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.switch[aria-pressed="true"] { color: var(--sel-ink); }
.switch[aria-pressed="true"] .knob { background: var(--accent); }
.switch[aria-pressed="true"] .knob::after { left: 16px; }
.moodzone { display: flex; flex-direction: column; gap: 2px; }
.moodzone.off { opacity: .3; pointer-events: none; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--neg), var(--mid) 50%, var(--pos)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--neg), var(--mid) 50%, var(--pos)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%; background: var(--surface); border: 0; box-shadow: 0 1px 4px rgba(42,53,80,.3); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 0; box-shadow: 0 1px 4px rgba(42,53,80,.3); }
.scale { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: 11px; color: var(--faint); padding-inline: 46px; }
.moodrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.roundbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--sunk); font-size: 20px; font-weight: 700; line-height: 1; color: var(--sel-ink); }
.roundbtn:hover { background: var(--sel-bg); }

textarea { font: inherit; width: 100%; min-height: 60px; resize: vertical; padding: 10px 12px; border: 0; border-radius: 12px; background: var(--sunk); color: var(--ink); }
textarea::placeholder { color: var(--faint); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.primary { border: 0; background: var(--grad); color: #FFFFFF; font-weight: 800; padding: 13px 22px; border-radius: 16px; font-size: 16px; flex: 1; box-shadow: 0 4px 14px rgba(138, 127, 212, .25); }
.primary:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
.ghost { border: 0; background: var(--sunk); padding: 12px 16px; border-radius: 16px; font-weight: 600; }
.toast { font-size: 13px; font-weight: 600; color: var(--sel-ink); min-height: 1.2em; text-align: center; }

.seg { display: inline-flex; flex-wrap: wrap; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--sel-ink); box-shadow: 0 1px 3px rgba(42,53,80,.1); }

/* timeline */
.tl { position: relative; padding: 10px 6px 10px 0; }
.tl-grid { position: relative; margin-left: 46px; }
.tl-hour { position: absolute; left: -46px; right: 0; border-top: 1px solid var(--line); }
.tl-hour span { position: absolute; left: 0; top: -9px; font-family: var(--f-num); font-size: 11px; font-weight: 700; color: var(--faint); background: var(--surface); padding-right: 6px; }
.tl-half { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); opacity: .7; }
.blk { position: absolute; border: 0; border-left: 4px solid var(--pc); border-radius: 8px; background: color-mix(in oklab, var(--pc) 28%, var(--surface)); color: var(--ink); text-align: left; padding: 3px 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; line-height: 1.3; }
.blk .bt { font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.blk .bs { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.tiny { flex-direction: row; align-items: center; gap: 8px; padding-block: 0; }
.blk.tiny .bs { flex: none; }
.blk:hover { filter: brightness(1.03); }
.blk.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.blk.live { background: repeating-linear-gradient(135deg, var(--sel-bg) 0 6px, var(--surface) 6px 12px); border-left-color: var(--accent); }
.blk.skip { background: repeating-linear-gradient(135deg, var(--sunk) 0 6px, var(--surface) 6px 12px); border-left-color: var(--skip); color: var(--muted); }
.gap { position: absolute; left: 4px; right: 2px; border: 1.5px dashed var(--faint); border-radius: 8px; background: transparent; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; }
.gap:hover, .gap.sel { border-color: var(--accent); color: var(--sel-ink); background: var(--sel-bg); border-style: solid; }
.gaprow { display: flex; justify-content: center; align-items: center; width: 100%; border: 1.5px dashed var(--faint); border-radius: 10px; background: transparent; color: var(--muted); padding: 7px 10px; margin-block: 6px; font-size: 13px; font-weight: 600; }
.gaprow:hover { border-color: var(--accent); color: var(--sel-ink); }
.now { position: absolute; left: -6px; right: 0; border-top: 2px solid var(--accent); }
.now::before { content: ""; position: absolute; left: 0; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.blk.ov { box-shadow: inset 0 0 0 1.5px var(--neg); }
.ovtag { position: absolute; right: 4px; bottom: 3px; font-size: 10px; font-weight: 700; color: var(--neg-ink); background: var(--surface); border-radius: 999px; padding: 0 6px; }
.strip { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.sbar { position: relative; height: 22px; border-radius: 8px; background: var(--sunk); overflow: hidden; }
.sseg { position: absolute; top: 0; bottom: 0; border: 0; padding: 0; background: var(--pc); border-right: 1px solid var(--surface); }
.sseg.skip { background: repeating-linear-gradient(135deg, var(--skip) 0 4px, var(--sunk) 4px 8px); }
.sseg:hover { filter: brightness(.95); }
.sticks { position: relative; height: 14px; font-size: 11px; font-weight: 700; color: var(--faint); }
.sticks span { position: absolute; transform: translateX(-50%); }
.sticks span:first-child { transform: none; }
.sticks span:last-child { transform: translateX(-100%); }
.slegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.slegend .lg { display: inline-flex; align-items: center; gap: 5px; }
.slegend i { width: 9px; height: 9px; border-radius: 3px; background: var(--pc); }
.slegend b { font-weight: 800; }

.bk { display: flex; flex-direction: column; }
.bkrow { display: grid; grid-template-columns: minmax(0, 1fr) 2.6em 3.6em 3.2em; gap: 8px; align-items: baseline; padding: 6px 0; font-size: 14px; }
.bkrow .n { text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 700; }
.bkhead { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 0; }
.bkhead .n { font-family: var(--f-body); }
.bkp { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; font-weight: 800; }
.bkp .nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.bkp .nm i { width: 9px; height: 9px; border-radius: 3px; background: var(--pc); flex: none; align-self: center; }
.bkp .nm small { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.bkp.skip { color: var(--muted); }
.bkt { padding-left: 15px; color: var(--ink); }
.bkt .nm { min-width: 0; display: flex; flex-direction: column; overflow-wrap: anywhere; font-weight: 600; }
.bkt .nm small { font-size: 11px; color: var(--muted); font-weight: 600; }
.bkt .n { font-weight: 600; }

.ghost.danger { color: var(--danger); }
.ghost.danger.confirm { background: var(--danger); color: #FFFFFF; }
.snack { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.snack button { border: 0; background: var(--sel-bg); color: var(--sel-ink); font-weight: 800; padding: 5px 14px; border-radius: 999px; flex: none; }

/* entries */
.entries { display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; padding: 12px 0; align-items: start; }
.entry + .entry { border-top: 1px solid var(--line); }
.entry .bar { align-self: stretch; border-radius: 2px; background: var(--pc); }
.entry .main { min-width: 0; }
.entry .when { font-family: var(--f-num); font-size: 13px; font-weight: 700; color: var(--muted); }
.entry .p { font-weight: 700; }
.entry .tk { display: inline-block; margin-left: 6px; font-size: 13px; color: var(--muted); }
.entry .note { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; white-space: pre-wrap; }
.entry .side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* stats */
.rangebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.kpis .stat:nth-child(odd) { border-left: 0; }
@media (max-width: 480px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 481px) { .kpis .stat:nth-child(odd) { border-left: 1px solid var(--line); } .kpis .stat:first-child { border-left: 0; } }
.chart { display: flex; flex-direction: column; gap: 6px; }
.cols { display: grid; gap: 4px; align-items: end; height: 140px; border-bottom: 1px solid var(--line); }
.col { display: flex; flex-direction: column-reverse; align-items: stretch; justify-content: flex-start; height: 100%; min-width: 0; border: 0; background: none; padding: 0; position: relative; }

.col .seg-b:last-child { border-radius: 4px 4px 0 0; }

.col.cur::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.col .hv { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.dlabels { display: grid; gap: 4px; text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }

.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: grid; grid-template-columns: minmax(0, 8.5em) 1fr 4.2em 3.4em; gap: 10px; align-items: center; font-size: 14px; }

.prow .hv, .prow .mv { text-align: right; font-family: var(--f-num); font-size: 13px; font-weight: 700; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 520px) { .mgrid { grid-template-columns: 1fr; } }
.mlist { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 7em) 1fr 3.2em; gap: 8px; align-items: center; font-size: 13px; }
.mrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.mrow .nm small { color: var(--muted); font-size: 11px; margin-left: 3px; font-weight: 400; }
.dv { position: relative; height: 8px; background: var(--sunk); border-radius: 4px; }
.dv::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; border-left: 1px solid var(--faint); }
.dv b { position: absolute; top: 0; bottom: 0; background: var(--mc); border-radius: 4px; }
.mrow .mv { text-align: right; font-family: var(--f-num); font-weight: 700; }
.insight { font-size: 14px; padding: 12px 14px; border-radius: 14px; background: var(--sel-bg); color: var(--sel-ink); }
.insight b { font-weight: 800; }

.overlap { font-size: 13px; color: var(--neg-ink); background: color-mix(in oklab, var(--neg) 14%, var(--surface)); padding: 8px 12px; border-radius: 12px; }
.tbtn.soft { background: var(--surface); color: var(--sel-ink); }
.rh { position: absolute; left: 0; right: 0; height: 12px; cursor: ns-resize; z-index: 1; }
@media (hover: none) { .rh { display: none; } }
.rh.rh-top { top: -2px; } .rh.rh-bot { bottom: -2px; }
.rh::after { content: ""; position: absolute; left: 50%; top: 50%; width: 24px; height: 3px; margin: -1.5px 0 0 -12px; border-radius: 2px; background: var(--pc); opacity: 0; transition: opacity .12s; }
.blk:hover .rh::after, .blk.dragging .rh::after { opacity: .9; }

.mchart svg { width: 100%; height: auto; display: block; overflow: visible; }

/* search */
.search input { width: 100%; font: inherit; padding: 10px 16px; border: 0; border-radius: 999px; background: var(--sunk); color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.results { display: flex; flex-direction: column; }
.res { display: grid; grid-template-columns: 4px 1fr; gap: 10px; text-align: left; border: 0; background: none; padding: 10px 0; }
.res + .res { border-top: 1px solid var(--line); }
.res:hover .rt { color: var(--sel-ink); }
.res .bar { border-radius: 2px; background: var(--pc); }
.res .rm { min-width: 0; }
.res .rd { font-family: var(--f-num); font-size: 12px; font-weight: 700; color: var(--muted); }
.res .rt { font-weight: 700; }
.res .rn { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
mark { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 2px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-inline: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script>
(() => {
  const DEFAULT_CFG = {
    projects: ["官網改版", "品牌提案", "內部行政"],
    tasks: ["會議", "設計", "撰寫文件", "溝通聯繫", "研究"],
    archived: { projects: [], tasks: [] }
  };
  const DUR_PRESETS = [15, 30, 60, 90, 120, 180];
  const WD = ["日", "一", "二", "三", "四", "五", "六"];
  const LS_KEY = "worklog.v1";
  const LS_TIMER = "worklog.timer";
  const LS_UI = "worklog.ui";
  const PX_PER_MIN = 1.5;
  const P_COLORS = 6;

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const md = s => { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
  const fmtDur = m => Math.floor(m / 60) + ":" + pad(m % 60);
  const fmtH = m => (Math.round(m / 60 * 10) / 10).toString();
  const hhmm = m => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const toMin = s => { if (!s) return null; const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const minOf = d => d.getHours() * 60 + d.getMinutes();
  const nowMin = () => minOf(new Date());
  const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v);
  const signed1 = v => { const r = Math.round(v * 10) / 10; return (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(1); };
  const moodWord = v => v <= -6 ? "很差" : v <= -2 ? "偏低" : v <= 1 ? "普通" : v <= 5 ? "不錯" : "很好";
  const moodColor = v => {
    if (v == null) return "var(--line)";
    const p = Math.round(Math.min(10, Math.abs(v)) * 10);
    return "color-mix(in oklab, var(" + (v < 0 ? "--neg" : "--pos") + ") " + p + "%, var(--mid))";
  };
  const moodInk = v => {
    if (v == null) return "var(--muted)";
    const p = Math.round(35 + Math.min(10, Math.abs(v)) * 6.5);
    return Math.abs(v) < 0.5 ? "var(--muted)" : "color-mix(in oklab, var(" + (v < 0 ? "--neg-ink" : "--pos-ink") + ") " + p + "%, var(--muted))";
  };
  const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
  /* time-weighted mood: each entry counts by its minutes; falls back to a plain mean if no durations */
  const isWork = e => !e.skip;
  const wmood = all => {
    const es = all.filter(e => !e.skip && typeof e.mood === "number");
    if (!es.length) return null;
    const w = es.reduce((s, e) => s + Math.max(0, e.minutes || 0), 0);
    return w > 0 ? es.reduce((s, e) => s + e.mood * Math.max(0, e.minutes || 0), 0) / w : avg(es.map(e => e.mood));
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  let ui = { view: "timeline", range: "7d", rFrom: null, rTo: null, tab: "log" };
  try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || "{}")); } catch (e) {}
  const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch (e) {} };

  const state = {
    day: ymd(new Date()),
    cfg: structuredClone(DEFAULT_CFG),
    entries: [],
    form: null,
    editingId: null,
    editing: { projects: false, tasks: false },
    adding: { projects: false, tasks: false },
    pendingDelete: null,
    pendingRemove: null,
    manageSel: null,
    timer: null,
    query: ""
  };

  function normalize(e) {
    const o = { ...e };
    if (o.ms !== 10 && typeof o.mood === "number" && o.mood >= 1 && o.mood <= 5) o.mood = (o.mood - 3) * 5;
    if (typeof o.start === "number" && typeof o.end === "number") o.minutes = o.end - o.start;
    if (o.skip) o.mood = null;
    o.project = o.project || ""; o.task = o.task || "";
    return o;
  }
  function normCfg(d) {
    return {
      projects: [...(d.projects || [])],
      tasks: [...(d.tasks || [])],
      archived: { projects: [...((d.archived && d.archived.projects) || [])], tasks: [...((d.archived && d.archived.tasks) || [])] }
    };
  }
  const active = kind => state.cfg[kind].filter(n => !state.cfg.archived[kind].includes(n));
  const isArchived = (kind, n) => state.cfg.archived[kind].includes(n);
  const labelOf = e => {
    const t = [e.project, e.task].filter(Boolean).join("・");
    if (t) return t;
    if (e.skip) return e.note ? (e.note.length > 14 ? e.note.slice(0, 14) + "…" : e.note) : "非工作";
    return "未命名";
  };
  const projectColor = name => {
    if (!name) return "var(--skip)";
    let i = state.cfg.projects.indexOf(name);
    if (i < 0) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; i = h; }
    return "var(--p" + (i % P_COLORS + 1) + ")";
  };
  const dayEntries = ds => state.entries.filter(e => e.date === ds)
    .sort((a, b) => (a.start ?? 9999) - (b.start ?? 9999) || (a.createdAt || 0) - (b.createdAt || 0));
  const lastEnd = (ds, exceptId) => {
    const ends = state.entries.filter(e => e.date === ds && e.id !== exceptId && typeof e.end === "number").map(e => e.end);
    return ends.length ? Math.max(...ends) : null;
  };

  function freshForm(keepProject) {
    const le = lastEnd(state.day);
    let start = le != null ? le : 9 * 60;
    if (start > 23 * 60) start = 23 * 60;
    return { project: keepProject || null, task: null, start, end: Math.min(start + 60, 1439), mood: 0, skip: false, note: "", timeTouched: false };
  }
  state.form = freshForm();

  /* ---------- storage ---------- */
  const store = {
    mode: "local", db: null, ready: false,
    loadLocal() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) { const o = JSON.parse(raw); state.entries = (o.entries || []).map(normalize); if (o.cfg) state.cfg = normCfg(o.cfg); }
        const t = localStorage.getItem(LS_TIMER); if (t) state.timer = JSON.parse(t);
      } catch (e) {}
    },
    persistLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ entries: state.entries, cfg: state.cfg })); } catch (e) {}
    },
    older: new Map(), live: [], deleted: new Set(),
    merge() {
      const m = new Map();
      this.older.forEach((v, k) => m.set(k, v));
      this.live.forEach(e => m.set(e.id, e));
      state.entries = [...m.values()];
    },
    async saveEntry(entry, id) {
      if (this.mode === "db") {
        const col = this.db.collection("entries");
        if (id) this.deleted.delete(id);
        await (id ? col.doc(id) : col.doc()).set(entry);
        if (id && this.older.has(id)) { this.older.set(id, normalize({ ...entry, id })); this.merge(); render(); }
      } else {
        if (id && state.entries.some(e => e.id === id)) state.entries = state.entries.map(e => e.id === id ? { ...entry, id } : e);
        else if (id) state.entries.push({ ...entry, id });
        else state.entries.push({ ...entry, id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) });
        this.persistLocal(); render();
      }
    },
    async deleteEntry(id) {
      if (this.mode === "db") {
        this.deleted.add(id);
        await this.db.collection("entries").doc(id).delete();
        if (this.older.delete(id)) { this.merge(); render(); }
      }
      else { state.entries = state.entries.filter(e => e.id !== id); this.persistLocal(); render(); }
    },
    async saveCfg() {
      render();
      if (this.mode === "db") await this.db.doc("settings/lists").set({ projects: state.cfg.projects, tasks: state.cfg.tasks, archived: state.cfg.archived });
      else this.persistLocal();
    },
    async saveTimer(t) {
      state.timer = t; render();
      if (this.mode === "db") await this.db.doc("settings/timer").set(t ? { running: true, ...t } : { running: false });
      else { try { t ? localStorage.setItem(LS_TIMER, JSON.stringify(t)) : localStorage.removeItem(LS_TIMER); } catch (e) {} }
    }
  };

  function refreshDefaultTimes() {
    if (state.editingId || state.form.timeTouched) return;
    const f = freshForm(state.form.project);
    state.form.start = f.start; state.form.end = f.end;
  }

  async function initSample() {
    try {
      const sm = window.claude && window.claude.use ? await window.claude.use("sample") : null;
      if (sm) { store.sample = sm; $("aiBox").hidden = false; }
    } catch (e) {}
  }
  async function initStore() {
    initSample();
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) {
      store.loadLocal();
      $("storeNote").textContent = "資料存在這台裝置上，請定期備份";
      store.dl = webDownload; $("exportBtn").hidden = false;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      store.ready = true; refreshDefaultTimes(); render();
      return;
    }
    store.mode = "db"; store.db = db; store.ready = true;
    $("storeNote").textContent = "資料已同步保存，手機和電腦都看得到";
    db.doc("settings/lists").onSnapshot(snap => {
      if (snap.exists) state.cfg = normCfg(snap.data());
      render();
    }, () => {});
    db.doc("settings/timer").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      state.timer = d && d.running ? { startAt: d.startAt, project: d.project || null, task: d.task || null } : null;
      render();
    }, () => {});
    let olderStarted = false;
    const PAGE = 1000;
    const loadOlder = async before => {
      try {
        for (;;) {
          const snap = await db.collection("entries").where("createdAt", "<", before).orderBy("createdAt", "desc").limit(PAGE).get();
          snap.docs.forEach(d => { if (!store.deleted.has(d.id)) store.older.set(d.id, normalize({ ...d.data(), id: d.id })); });
          store.merge(); render();
          $("storeNote").textContent = "資料已同步保存，共 " + state.entries.length + " 筆紀錄";
          if (snap.size < PAGE) break;
          before = snap.docs[snap.docs.length - 1].data().createdAt;
        }
      } catch (e) { $("storeNote").textContent = "較舊的紀錄沒有載入完整，請重新整理頁面"; }
    };
    db.collection("entries").orderBy("createdAt", "desc").limit(PAGE).onSnapshot(snap => {
      const full = snap.size >= PAGE;
      snap.docChanges().forEach(ch => {
        // a document leaving a full window has scrolled out of it, not been deleted
        if (ch.type === "removed" && full && !store.deleted.has(ch.doc.id)) store.older.set(ch.doc.id, normalize({ ...ch.doc.data(), id: ch.doc.id }));
      });
      store.live = snap.docs.map(d => normalize({ ...d.data(), id: d.id }));
      store.live.forEach(e => store.older.delete(e.id));
      store.merge();
      refreshDefaultTimes();
      render();
      if (full && !olderStarted && !snap.metadata.fromCache) {
        olderStarted = true;
        loadOlder(store.live[store.live.length - 1].createdAt);
      }
    }, () => { $("storeNote").textContent = "同步中斷，請重新整理頁面"; });
    try {
      const dl = await window.claude.use("downloads");
      if (dl) { store.dl = dl; $("exportBtn").hidden = false; }
    } catch (e) {}
  }

  /* ---------- timer ---------- */
  function elapsedText(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60);
  }
  function tickTimer() {
    const t = state.timer;
    if (!t) return;
    const txt = elapsedText(Date.now() - t.startAt);
    $("tClock").textContent = txt;
    $("runPill").textContent = "計時中 " + txt.slice(0, 5);
  }
  setInterval(tickTimer, 1000);

  function renderTimer() {
    const t = state.timer;
    $("timer").classList.toggle("on", !!t);
    $("tStartBtn").hidden = !!t;
    $("tStopBtn").hidden = !t;
    $("tCancelBtn").hidden = !t;
    $("tSwitchBtn").hidden = !t;
    $("runPill").hidden = !t;
    if (!t) {
      $("tClock").textContent = "計時器";
      $("tSub").textContent = "做完按停止，時間會自動填好";
      return;
    }
    const sd = new Date(t.startAt);
    const what = [t.project, t.task].filter(Boolean).join("・");
    $("tSub").textContent = (ymd(sd) !== ymd(new Date()) ? md(ymd(sd)) + " " : "") + hhmm(minOf(sd)) + " 開始" + (what ? "　" + what : "");
    tickTimer();
  }

  /* ---------- chips & manage ---------- */
  const fieldOf = kind => kind === "projects" ? "project" : "task";
  const usage = (kind, name) => state.entries.filter(e => e[fieldOf(kind)] === name).length;

  async function renameItem(kind, oldN, newN) {
    newN = (newN || "").trim();
    if (!newN || newN === oldN) return;
    const list = state.cfg[kind];
    const merging = list.includes(newN);
    state.cfg[kind] = merging ? list.filter(n => n !== oldN) : list.map(n => n === oldN ? newN : n);
    const arch = state.cfg.archived[kind].filter(n => n !== oldN);
    if (!merging && state.cfg.archived[kind].includes(oldN)) arch.push(newN);
    state.cfg.archived[kind] = arch;
    if (kind === "projects" && state.form.project === oldN) state.form.project = newN;
    if (kind === "tasks" && state.form.task === oldN) state.form.task = newN;
    state.manageSel = { kind, name: newN };
    const field = fieldOf(kind);
    const affected = state.entries.filter(e => e[field] === oldN);
    await store.saveCfg();
    if (store.mode === "db") {
      const col = store.db.collection("entries");
      for (const e of affected) await col.doc(e.id).update({ [field]: newN });
      store.older.forEach((e, k) => { if (e[field] === oldN) store.older.set(k, { ...e, [field]: newN }); });
      store.merge(); render();
    } else {
      state.entries = state.entries.map(e => e[field] === oldN ? { ...e, [field]: newN } : e);
      store.persistLocal(); render();
    }
    return affected.length;
  }
  function deleteItem(kind, name) {
    state.cfg[kind] = state.cfg[kind].filter(n => n !== name);
    state.cfg.archived[kind] = state.cfg.archived[kind].filter(n => n !== name);
    if (kind === "projects" && state.form.project === name) state.form.project = null;
    if (kind === "tasks" && state.form.task === name) state.form.task = null;
    state.manageSel = null; state.pendingRemove = null;
    return store.saveCfg();
  }

  function managePanel(kind, name) {
    const p = el("div", "mpanel");
    const n = usage(kind, name);
    const archived = isArchived(kind, name);
    p.append(el("div", "mtitle", "「" + name + "」" + (archived ? "（已封存）" : "") + "・用在 " + n + " 筆紀錄"));
    const f = el("form", "addrow");
    const inp = el("input"); inp.id = "rename-" + kind; inp.value = name; inp.maxLength = 40; inp.setAttribute("aria-label", "新名稱");
    const sb = el("button", null, "改名"); sb.type = "submit";
    f.append(inp, sb);
    f.onsubmit = async ev => {
      ev.preventDefault();
      const v = inp.value.trim();
      if (!v || v === name) return;
      const merging = state.cfg[kind].includes(v);
      try {
        const c = await renameItem(kind, name, v);
        flash((merging ? "已合併到「" + v + "」" : "已改名為「" + v + "」") + (c ? "，並更新 " + c + " 筆舊紀錄" : ""));
      } catch (e) { flash("改名沒有完成，請檢查網路後再試一次"); }
    };
    p.append(f);
    if (n) p.append(el("div", "hint", "改名會一併更新這 " + n + " 筆舊紀錄。改成已存在的名稱，兩者會合併。"));
    const btns = el("div", "mbtns");
    const ar = el("button", "mb", archived ? "還原到選單" : "封存"); ar.type = "button";
    ar.onclick = () => {
      if (archived) state.cfg.archived[kind] = state.cfg.archived[kind].filter(x => x !== name);
      else {
        state.cfg.archived[kind].push(name);
        if (kind === "projects" && state.form.project === name) state.form.project = null;
        if (kind === "tasks" && state.form.task === name) state.form.task = null;
      }
      state.manageSel = null;
      safe(() => store.saveCfg(), archived ? "已還原「" + name + "」" : "已封存「" + name + "」");
    };
    const key = kind + ":" + name;
    const del = el("button", "mb danger", state.pendingRemove === key ? "確定刪除" : "刪除"); del.type = "button";
    del.onclick = () => {
      if (state.pendingRemove !== key) { state.pendingRemove = key; render(); return; }
      safe(() => deleteItem(kind, name), "已刪除「" + name + "」");
    };
    const close = el("button", "mb quiet", "關閉"); close.type = "button";
    close.onclick = () => { state.manageSel = null; state.pendingRemove = null; render(); };
    btns.append(ar, del, close);
    p.append(btns);
    if (state.pendingRemove === key) {
      p.append(el("div", "warn", n
        ? "刪除後它不會出現在選單，但那 " + n + " 筆舊紀錄會保留原本的名稱。如果只是打錯字，用上面的「改名」比較好。"
        : "這個名稱沒有被任何紀錄用到，可以放心刪除。"));
    }
    return p;
  }

  function chipList(kind) {
    const el0 = $(kind === "projects" ? "projectChips" : "taskChips");
    const archEl = $(kind === "projects" ? "projectArch" : "taskArch");
    const picked = kind === "projects" ? state.form.project : state.form.task;
    const editing = state.editing[kind];
    const sel = editing && state.manageSel && state.manageSel.kind === kind ? state.manageSel.name : null;
    el0.classList.toggle("editing", editing);
    el0.innerHTML = ""; archEl.innerHTML = "";
    const mkChip = name => {
      const b = el("button", "chip"); b.type = "button";
      b.setAttribute("aria-pressed", String(editing ? sel === name : picked === name));
      if (kind === "projects") { b.style.setProperty("--pc", projectColor(name)); b.append(el("span", "dot")); }
      b.append(document.createTextNode(name));
      b.onclick = () => {
        if (state.editing[kind]) {
          state.pendingRemove = null;
          state.manageSel = sel === name ? null : { kind, name };
          render();
          if (state.manageSel) setTimeout(() => { const i = $("rename-" + kind); i && i.focus(); }, 0);
          return;
        }
        if (kind === "projects") state.form.project = state.form.project === name ? null : name;
        else state.form.task = state.form.task === name ? null : name;
        render();
      };
      return b;
    };
    const shown = active(kind);
    if (picked && !editing && !shown.includes(picked)) shown.push(picked);
    shown.forEach(name => el0.append(mkChip(name)));
    if (state.adding[kind]) {
      const row = el("form", "addrow");
      row.innerHTML = '<input id="add-' + kind + '" maxlength="40" placeholder="' + (kind === "projects" ? "新案子名稱，例如 401-展覽設計" : "新工作項目") + '"><button type="submit">加入</button>';
      row.onsubmit = ev => {
        ev.preventDefault();
        const v = row.querySelector("input").value.trim();
        state.adding[kind] = false;
        if (!v) { render(); return; }
        if (state.cfg[kind].includes(v)) state.cfg.archived[kind] = state.cfg.archived[kind].filter(n => n !== v);
        else state.cfg[kind].push(v);
        if (kind === "projects") state.form.project = v; else state.form.task = v;
        store.saveCfg();
      };
      el0.append(row);
      setTimeout(() => { const i = row.querySelector("input"); i && i.focus(); }, 0);
    } else if (!editing) {
      const add = el("button", "chip add", "＋ 新增"); add.type = "button";
      add.onclick = () => { state.adding[kind] = true; render(); };
      el0.append(add);
    }
    if (editing) {
      const box = el("div", "archbox");
      if (sel && state.cfg[kind].includes(sel)) box.append(managePanel(kind, sel));
      else box.append(el("div", "hint", "點一個標籤，就可以改名、封存或刪除。封存會把它從選單收起來，但舊紀錄和統計都會保留。"));
      const arch = state.cfg.archived[kind];
      if (arch.length) {
        box.append(el("div", "hint", "已封存："));
        const wrap = el("div", "chips");
        arch.forEach(name => wrap.append(mkChip(name)));
        box.append(wrap);
      }
      archEl.append(box);
    }
  }

  /* ---------- day view ---------- */
  function startEdit(e) {
    state.editingId = e.id;
    const start = typeof e.start === "number" ? e.start : 9 * 60;
    state.form = {
      project: e.project, task: e.task, start,
      end: typeof e.end === "number" ? e.end : Math.min(start + (e.minutes || 60), 1439),
      mood: e.mood ?? 0, skip: !!e.skip, note: e.note || "", timeTouched: true
    };
    if (e.project && !state.cfg.projects.includes(e.project)) state.cfg.projects.push(e.project);
    if (e.task && !state.cfg.tasks.includes(e.task)) state.cfg.tasks.push(e.task);
    $("note").value = state.form.note;
    render();
    goTab("log");
  }

  function fillGap(gs, ge) {
    state.editingId = null; state.pendingDelete = null;
    state.form = { project: state.form.project, task: null, start: gs, end: ge, mood: 0, skip: false, note: "", timeTouched: true };
    $("note").value = "";
    render();
    flash("已填入 " + hhmm(gs) + "–" + hhmm(ge) + "，選好案子、工作項目和心情後按儲存");
    goTab("log");
  }

  function opsFor(e) {
    const ops = el("div", "ops");
    if (state.pendingDelete === e.id) {
      const yes = el("button", "del", "確定刪除");
      yes.onclick = async () => { state.pendingDelete = null; if (state.editingId === e.id) resetForm(); await deleteWithUndo(e); };
      const no = el("button", null, "取消");
      no.onclick = () => { state.pendingDelete = null; render(); };
      ops.append(yes, no);
    } else {
      const ed = el("button", null, "修改"); ed.onclick = () => startEdit(e);
      const del = el("button", "del", "刪除");
      del.onclick = () => { state.pendingDelete = e.id; render(); };
      ops.append(ed, del);
    }
    return ops;
  }

  function entryRow(e) {
    const row = el("div", "entry");
    row.style.setProperty("--pc", projectColor(e.project));
    row.style.setProperty("--mc", moodColor(e.mood));
    const main = el("div", "main");
    if (typeof e.start === "number") main.append(el("div", "when", hhmm(e.start) + " – " + hhmm(e.end)));
    if (e.project || e.task) main.append(el("span", "p", e.project || e.task), el("span", "tk", e.project ? e.task : ""));
    else main.append(el("span", "p", labelOf(e)));
    if (e.note && (e.project || e.task)) main.append(el("div", "note", e.note));
    const side = el("div", "side");
    side.append(el("span", "h", fmtDur(e.minutes)), e.skip ? el("span", "mtag skip", "不計入") : el("span", "mtag", signed(e.mood) + " " + moodWord(e.mood)), opsFor(e));
    row.append(el("div", "bar"), main, side);
    return row;
  }

  function attachDrag(b, e, hTop, hBot) {
    const begin = (ev, mode) => {
      // dragging is mouse-only; on phones a touch should scroll the page or open the entry
      if (ev.pointerType !== "mouse") return;
      if (ev.button > 0) return;
      ev.stopPropagation();
      const y0 = ev.clientY, s0 = e.start, e0 = e.end, len = e0 - s0;
      const baseTop = parseFloat(b.style.top);
      let moved = false, ns = s0, ne = e0;
      try { b.setPointerCapture(ev.pointerId); } catch (x) {}
      state.dragging = true;
      const onMove = m => {
        if (!moved && Math.abs(m.clientY - y0) < 8) return;
        moved = true;
        const dm = Math.round((m.clientY - y0) / PX_PER_MIN / 5) * 5;
        if (mode === "move") { ns = Math.min(Math.max(0, s0 + dm), 1439 - len); ne = ns + len; }
        else if (mode === "top") { ns = Math.min(Math.max(0, s0 + dm), e0 - 5); ne = e0; }
        else { ne = Math.max(Math.min(1439, e0 + dm), s0 + 5); ns = s0; }
        b.style.top = (baseTop + (ns - s0) * PX_PER_MIN) + "px";
        b.style.height = Math.max(16, (ne - ns) * PX_PER_MIN - 2) + "px";
        b.classList.add("dragging");
        const bs = b.querySelector(".bs"); if (bs) bs.textContent = hhmm(ns) + "–" + hhmm(ne) + "　放開就儲存";
      };
      const onUp = async () => {
        b.removeEventListener("pointermove", onMove);
        b.removeEventListener("pointerup", onUp);
        b.removeEventListener("pointercancel", onUp);
        state.dragging = false;
        // a plain click: leave the DOM alone so the click event can open the entry for editing
        if (!moved) return;
        b.dataset.dragged = "1";
        if (ns !== s0 || ne !== e0) {
          const { id, ...rest } = e;
          let ok = true;
          await safe(() => store.saveEntry({ ...rest, start: ns, end: ne, minutes: ne - ns }, id).catch(x => { ok = false; throw x; }));
          if (ok) snack("已調整為 " + hhmm(ns) + "–" + hhmm(ne) + "（原本 " + hhmm(s0) + "–" + hhmm(e0) + "）", () => store.saveEntry(rest, id));
        }
        render();
      };
      b.addEventListener("pointermove", onMove);
      b.addEventListener("pointerup", onUp);
      b.addEventListener("pointercancel", onUp);
    };
    hTop.addEventListener("pointerdown", ev => begin(ev, "top"));
    hBot.addEventListener("pointerdown", ev => begin(ev, "bot"));
    b.addEventListener("pointerdown", ev => { if (ev.target === hTop || ev.target === hBot) return; begin(ev, "move"); });
  }

  function renderDayBreak(des) {
    const box = $("breakBody"); box.innerHTML = "";
    $("dayBreak").hidden = !des.length;
    if (!des.length) return;
    const g = new Map();

      pr.append(nm, el("span", "n", String(x.es.length)), el("span", "n", fmtDur(x.m)), mv);

      [...byT.entries()].map(([t, es]) => ({ t, es, m: es.reduce((s, e) => s + e.minutes, 0) })).sort((a, b) => b.m - a.m).forEach(r => {

        tr.append(nmT, el("span", "n", String(r.es.length)), el("span", "n", fmtDur(r.m)), tmv);

  function dayStrip(timed) {
    const wrap = el("div", "strip");
    const lo = Math.floor(Math.min(...timed.map(e => e.start)) / 60) * 60;
    const hi = Math.ceil(Math.max(...timed.map(e => e.end)) / 60) * 60;
    const span = Math.max(60, hi - lo);
    const bar = el("div", "sbar");
    [...timed].sort((a, b) => a.start - b.start).forEach(e => {
      const sg = el("button", "sseg" + (e.skip ? " skip" : "")); sg.type = "button";
      sg.style.left = ((e.start - lo) / span * 100) + "%";
      sg.style.width = ((e.end - e.start) / span * 100) + "%";
      sg.style.setProperty("--pc", projectColor(e.project));
      sg.title = hhmm(e.start) + "–" + hhmm(e.end) + "　" + labelOf(e);
      sg.setAttribute("aria-label", sg.title);
      sg.onclick = () => startEdit(e);
      bar.append(sg);
    });
    const ticks = el("div", "sticks");
    const step = span > 600 ? 180 : span > 300 ? 120 : 60;
    for (let m = lo; m <= hi; m += step) { const t = el("span", "num", String(m / 60)); t.style.left = ((m - lo) / span * 100) + "%"; ticks.append(t); }
    const legend = el("div", "slegend");
    const byP = {}; let other = 0;
    timed.forEach(e => { if (e.skip) other += e.minutes; else byP[e.project] = (byP[e.project] || 0) + e.minutes; });
    Object.entries(byP).sort((a, b) => b[1] - a[1]).forEach(([n, m]) => {
      const it = el("span", "lg"); it.style.setProperty("--pc", projectColor(n));
      it.append(el("i"), document.createTextNode(n + " "), el("b", "num", fmtH(m) + "h"));
      legend.append(it);
    });
    if (other) { const it = el("span", "lg"); it.style.setProperty("--pc", "var(--skip)"); it.append(el("i"), document.createTextNode("其他 "), el("b", "num", fmtH(other) + "h")); legend.append(it); }
    wrap.append(bar, ticks, legend);
    return wrap;
  }

  function timeline(timed, live) {
    const wrap = el("div", "tl");
    const isToday = state.day === ymd(new Date());
    const all = live ? [...timed, live] : timed;
    let lo = Math.min(...all.map(e => e.start)), hi = Math.max(...all.map(e => e.end));
    if (isToday) { const n = nowMin(); if (n >= lo - 120 && n <= hi + 120) { lo = Math.min(lo, n); hi = Math.max(hi, n); } }
    const h0 = Math.floor(lo / 60), h1 = Math.max(h0 + 1, Math.min(24, Math.ceil(hi / 60)));
    const grid = el("div", "tl-grid");
    grid.style.height = ((h1 - h0) * 60 * PX_PER_MIN) + "px";
    const y = m => (m - h0 * 60) * PX_PER_MIN;
    for (let h = h0; h <= h1; h++) {
      const line = el("div", "tl-hour"); line.style.top = y(h * 60) + "px";
      line.append(el("span", "num", pad(h) + ":00"));
      grid.append(line);
      if (h < h1) { const hl = el("div", "tl-half"); hl.style.top = y(h * 60 + 30) + "px"; grid.append(hl); }
    }
    const byStart = [...all].sort((a, b) => a.start - b.start);
    let reach = byStart[0].start;
    byStart.forEach(e => {
      if (e.start - reach >= 5) {
        const gs = reach, ge = e.start;
        const g = el("button", "gap" + (state.form.start === gs && state.form.end === ge && !state.editingId ? " sel" : "")); g.type = "button";
        g.style.top = (y(gs) + 2) + "px"; g.style.height = Math.max(8, (ge - gs) * PX_PER_MIN - 4) + "px";
        g.setAttribute("aria-label", "空檔 " + hhmm(gs) + " 到 " + hhmm(ge) + "，點一下補記這段時間");
        g.title = "點一下補記 " + hhmm(gs) + "–" + hhmm(ge);
        if ((ge - gs) * PX_PER_MIN >= 18) g.textContent = "＋ 補記 " + hhmm(gs) + "–" + hhmm(ge) + "（" + fmtDur(ge - gs) + "）";
        g.onclick = () => fillGap(gs, ge);
        grid.append(g);
      }
      reach = Math.max(reach, e.end);
    });
    // lanes are assigned per cluster of overlapping blocks, so one overlap doesn't squeeze the whole day
    const placed = [];
    let cluster = [], clusterEnd = -1, laneEnds = [];
    const flush = () => { const n = laneEnds.length; cluster.forEach(p => { p.lanes = n; placed.push(p); }); cluster = []; laneEnds = []; };
    byStart.forEach(e => {
      if (e.start >= clusterEnd) { flush(); clusterEnd = -1; }
      let lane = laneEnds.findIndex(end => end <= e.start);
      if (lane < 0) { lane = laneEnds.length; laneEnds.push(e.end); } else laneEnds[lane] = e.end;
      cluster.push({ e, lane });
      clusterEnd = Math.max(clusterEnd, e.end);
    });
    flush();
    placed.forEach(({ e, lane, lanes }) => {
      const b = el("button"); b.type = "button";
      const hgt = Math.max(16, (e.end - e.start) * PX_PER_MIN - 2);
      b.className = "blk" + (hgt < 40 ? " tiny" : "") + (lanes > 1 ? " ov" : "") + (e.live ? " live" : "") + (state.editingId && state.editingId === e.id ? " sel" : "");
      b.style.top = (y(e.start) + 1) + "px"; b.style.height = hgt + "px";
      b.style.left = "calc(" + (lane / lanes * 100) + "% + 6px)";
      b.style.width = "calc(" + (100 / lanes) + "% - 10px)";
      if (e.live) {
        b.append(el("span", "bt", "計時中" + (e.project ? "・" + e.project : "")), el("span", "bs", hhmm(e.start) + " 開始"));
        b.onclick = () => goTab("log");
      } else {
        if (e.skip) b.classList.add("skip");
        b.style.setProperty("--pc", projectColor(e.project));
        b.style.setProperty("--mc", moodColor(e.mood));
        const moodTxt = e.skip ? "不計入" : "心情 " + signed(e.mood);
        b.setAttribute("aria-label", hhmm(e.start) + " 到 " + hhmm(e.end) + "，" + labelOf(e) + "，" + moodTxt + "，點一下修改");
        b.append(el("span", "bt", labelOf(e)), el("span", "bs", hhmm(e.start) + "–" + hhmm(e.end) + "　" + moodTxt));
        if (e.note && hgt >= 62) b.append(el("span", "bs", e.note));
        if (lanes > 1) b.append(el("span", "ovtag", "時間重疊"));
        const hTop = el("span", "rh rh-top"), hBot = el("span", "rh rh-bot");
        b.append(hTop, hBot);
        attachDrag(b, e, hTop, hBot);
        b.onclick = () => { if (b.dataset.dragged) { delete b.dataset.dragged; return; } startEdit(e); };
      }
      grid.append(b);
    });
    if (isToday) {
      const n = nowMin();
      if (n >= h0 * 60 && n <= h1 * 60) { const nl = el("div", "now"); nl.style.top = y(n) + "px"; nl.title = "現在"; grid.append(nl); }
    }
    wrap.append(grid);
    return wrap;
  }

  /* ---------- stats ---------- */
  function rangeDates() {
    const today = ymd(new Date());
    const t = parse(today);
    let from, to = today;
    if (ui.range === "7d") from = addDays(today, -6);
    else if (ui.range === "30d") from = addDays(today, -29);
    else if (ui.range === "month") from = ymd(new Date(t.getFullYear(), t.getMonth(), 1));
    else if (ui.range === "lastmonth") { from = ymd(new Date(t.getFullYear(), t.getMonth() - 1, 1)); to = ymd(new Date(t.getFullYear(), t.getMonth(), 0)); }
    else { from = ui.rFrom || ymd(new Date(t.getFullYear(), t.getMonth(), 1)); to = ui.rTo || today; if (from > to) [from, to] = [to, from]; }
    return { from, to };
  }

  function groupMood(list, key) {
    const g = {};
    list.filter(isWork).forEach(e => { (g[e[key]] = g[e[key]] || []).push(e); });
    return Object.entries(g).map(([name, es]) => ({ name, n: es.length, mood: wmood(es), mins: es.reduce((s, e) => s + e.minutes, 0) }))
      .sort((a, b) => a.mood - b.mood);
  }
  function moodRows(target, rows) {
    target.innerHTML = "";
    if (!rows.length) { target.append(el("div", "hint", "這段期間還沒有紀錄")); return; }

      dv.append(b);

  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function renderMoodChart(days, inR) {
    const box = $("moodChart"); box.innerHTML = "";
    $("moodRangeLbl").textContent = md(days[0]) + " – " + md(days[days.length - 1]);
    if (days.length > 62) { box.append(el("div", "hint", "期間超過 62 天，請選較短的期間來看心情曲線。")); return; }
    const scored = inR.filter(e => typeof e.mood === "number" && days.includes(e.date));
    if (!scored.length) { box.append(el("div", "hint", "這段期間還沒有心情紀錄。記下幾筆工作後，這裡會畫出每天的心情變化。")); return; }
    const W = 360, H = 210, L = 30, R = 10, T = 18, B = 36;
    const n = days.length, cw = (W - L - R) / n;
    const y = v => T + (10 - v) / 20 * (H - T - B);
    const parts = [];
    // grid
    [10, 5, 0, -5, -10].forEach(v => {
      parts.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--' + (v === 0 ? "faint" : "line") + ')" stroke-width="1"' + (v === 0 ? "" : ' stroke-dasharray="2 3"') + '/>');
      parts.push('<text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="10" font-weight="700" fill="var(--faint)">' + (v > 0 ? "+" + v : v < 0 ? "−" + -v : "0") + '</text>');
    });
    // each entry, placed at its time of day inside the day's column (06:00–22:00 spread across the column)
    scored.forEach(e => {
      const di = days.indexOf(e.date);
      const mid = typeof e.start === "number" ? (e.start + e.end) / 2 : 720;
      const frac = Math.min(1, Math.max(0, (mid - 360) / 960)) * 0.8 + 0.1;
      const r = 2 + Math.min(4, (e.minutes || 0) / 30);
      const tip = (typeof e.start === "number" ? hhmm(e.start) + "–" + hhmm(e.end) + " " : "") + labelOf(e) + "　心情 " + signed(e.mood);
      parts.push('<circle cx="' + (L + cw * (di + frac)).toFixed(1) + '" cy="' + y(e.mood).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + moodInk(e.mood) + '" fill-opacity=".28"><title>' + esc(md(e.date) + " " + tip) + '</title></circle>');
    });
    // daily weighted average line
    const daily = days.map((ds, i) => ({ ds, i, v: wmood(scored.filter(e => e.date === ds)) })).filter(d => d.v != null);
    if (daily.length > 1) {
      const pts = daily.map(d => (L + cw * (d.i + .5)).toFixed(1) + "," + y(d.v).toFixed(1));
      parts.push('<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>');
    }
    const showVal = n <= 16;
    daily.forEach(d => {
      const cx = L + cw * (d.i + .5), cy = y(d.v);
      parts.push('<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="4.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"><title>' + esc(md(d.ds) + " 平均心情 " + signed1(d.v)) + '</title></circle>');
      if (showVal) parts.push('<text x="' + cx.toFixed(1) + '" y="' + (cy < T + 14 ? cy + 17 : cy - 9).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-weight="800" fill="' + moodInk(d.v) + '">' + signed1(d.v) + '</text>');
    });
    // x labels
    const step = n <= 7 ? 1 : n <= 16 ? 2 : n <= 31 ? 5 : 7;
    days.forEach((ds, i) => {
      const d0 = parse(ds);
      if (!(n <= 7 || i % step === 0 || d0.getDate() === 1)) return;
      const cx = L + cw * (i + .5);
      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - B + 15) + '" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">' + (n <= 7 ? "週" + WD[d0.getDay()] : md(ds)) + '</text>');
      if (n <= 7) parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - B + 28) + '" text-anchor="middle" font-size="9.5" fill="var(--faint)">' + md(ds) + '</text>');
    });
    const wrap = el("div", "mchart");
    wrap.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="每日平均心情折線圖">' + parts.join("") + '</svg>';
    // CSS variables / color-mix belong in style, not in SVG presentation attributes
    wrap.querySelectorAll("[fill],[stroke]").forEach(nd => ["fill", "stroke"].forEach(k => { const v = nd.getAttribute(k); if (v && /var\(|color-mix/.test(v)) nd.style[k] = v; }));
    box.append(wrap);
    const lg = el("div", "mlegend");
    lg.innerHTML = '<span><i class="ln"></i>每天的平均心情（依時間加權）</span><span><i class="dt"></i>每一筆紀錄，依時段排在當天位置，點越大做得越久</span>';
    box.append(lg);
  }

  function renderStats() {
    document.querySelectorAll("[data-range]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.range === ui.range)));
    const { from, to } = rangeDates();
    $("rCustom").hidden = ui.range !== "custom";
    if (ui.range === "custom") { if (document.activeElement !== $("rFrom")) $("rFrom").value = from; if (document.activeElement !== $("rTo")) $("rTo").value = to; }
    const days = []; for (let d = from; d <= to && days.length < 400; d = addDays(d, 1)) days.push(d);
    $("rLabel").textContent = from.replace(/-/g, "/") + " – " + to.replace(/-/g, "/") + "，共 " + days.length + " 天";
    const allR = state.entries.filter(e => e.date >= from && e.date <= to);
    const inR = allR.filter(isWork);
    const otherMins = allR.filter(e => e.skip).reduce((s, e) => s + e.minutes, 0);
    $("kOther").textContent = otherMins ? "另有其他 " + fmtH(otherMins) + " 小時" : "";
    const tot = inR.reduce((s, e) => s + e.minutes, 0);
    const activeDays = new Set(inR.map(e => e.date)).size;
    const am = wmood(inR);
    $("kHours").innerHTML = fmtH(tot) + "<small>小時</small>";
    $("kDays").innerHTML = activeDays + "<small>天</small>";
    $("kAvg").innerHTML = (activeDays ? fmtH(Math.round(tot / activeDays)) : "0") + "<small>小時</small>";
    $("kMood").textContent = am == null ? "–" : signed1(am);
    $("kMood").style.color = moodInk(am);

    // stacked chart
    const chart = $("chart"); chart.innerHTML = "";
    if (days.length > 62) {
      chart.append(el("div", "hint", "期間超過 62 天，不畫每日長條；下面的統計仍會計算整段期間。"));
    } else {
      const per = days.map(ds => {
        const es = inR.filter(e => e.date === ds);
        const byP = {}; es.forEach(e => byP[e.project] = (byP[e.project] || 0) + e.minutes);
        return { ds, m: es.reduce((s, e) => s + e.minutes, 0), mood: wmood(es), byP };
      });
      const maxM = Math.max(480, ...per.map(x => x.m));
      const cols = el("div", "cols"), dl = el("div", "dlabels");
