    const dc = $("durChips"); dc.innerHTML = "";
    DUR_PRESETS.forEach(m => {
      const b = el("button", "chip num", m < 60 ? m + " 分" : (m / 60) + " 小時"); b.type = "button";
      b.setAttribute("aria-pressed", String(dur === m));
      b.onclick = () => { f.end = Math.min(f.start + m, 1439); f.timeTouched = true; render(); };
      dc.append(b);
    });
    $("qChain").hidden = lastEnd(state.day, state.editingId) == null;
    const timeOk = dur > 0;
    $("timeWarn").hidden = timeOk;
    $("timeWarn").textContent = "結束時間要晚於開始時間（跨過午夜請分成兩筆記）";
    const ov = timeOk ? state.entries.filter(e => e.date === state.day && e.id !== state.editingId && typeof e.start === "number" && e.start < f.end && e.end > f.start) : [];
    $("overlapWarn").hidden = !ov.length;
    $("overlapWarn").textContent = ov.length ? "和已有的紀錄時間重疊：" + ov.map(e => hhmm(e.start) + "–" + hhmm(e.end) + " " + labelOf(e)).join("、") + "。確定沒問題仍可儲存。" : "";

    $("mood").value = f.mood;
    $("moodSkip").setAttribute("aria-pressed", String(!!f.skip));
    $("moodZone").classList.toggle("off", !!f.skip);
    $("moodBig").textContent = f.skip ? "—" : signed(f.mood);
    $("moodBig").style.setProperty("--mc", f.skip ? "var(--muted)" : moodInk(f.mood));
    $("moodWord").textContent = f.skip ? "非工作，不算心情和工時；案子可不選" : moodWord(f.mood);

    const ready = (f.skip || (f.project && f.task)) && timeOk;
    $("saveBtn").disabled = !ready || !store.ready;
    $("saveBtn").textContent = state.editingId ? "更新紀錄" : "儲存紀錄";
    $("cancelEdit").hidden = !state.editingId;
    $("delEdit").hidden = !state.editingId;
    $("delEdit").classList.toggle("confirm", !!state.editingId && state.pendingDelete === state.editingId);
    $("delEdit").textContent = state.editingId && state.pendingDelete === state.editingId ? "確定刪除" : "刪除這筆";
    $("editFlag").hidden = !state.editingId;
    if (!$("toast").dataset.hold) {
      const miss = [];
      if (!f.skip && !f.project) miss.push("案子");
      if (!f.skip && !f.task) miss.push("工作項目");
      $("toast").textContent = miss.length ? "還要選：" + miss.join("、") : "";
    }

    // day view
    $("listTitle").textContent = (state.day === today ? "今天" : (d.getMonth() + 1) + "/" + d.getDate()) + "的紀錄";
    $("vTimeline").setAttribute("aria-pressed", String(ui.view === "timeline"));
    $("vList").setAttribute("aria-pressed", String(ui.view === "list"));
    renderDayBreak(des);
    const tdes = des.filter(e => typeof e.start === "number");
    $("daySpan").textContent = tdes.length ? hhmm(Math.min(...tdes.map(e => e.start))) + " – " + hhmm(Math.max(...tdes.map(e => e.end))) + "　共 " + des.length + " 筆" : "";
    const box = $("entries"); box.innerHTML = "";
    let live = null;
    if (state.timer && ymd(new Date(state.timer.startAt)) === state.day && state.day === today) {
      const s = minOf(new Date(state.timer.startAt));
      live = { live: true, start: s, end: Math.max(s + 5, nowMin()), project: state.timer.project };
    }
    if (!des.length && !live) {
      box.innerHTML = '<div class="empty">這天還沒有紀錄。<br>按「開始計時」，或直接點選案子、工作項目、時間和心情後按「儲存紀錄」。</div>';
    } else if (ui.view === "timeline") {
      const timed = des.filter(e => typeof e.start === "number");
      const untimed = des.filter(e => typeof e.start !== "number");
      if (timed.length) box.append(dayStrip(timed));
      if (timed.length || live) box.append(timeline(timed, live));
      if (untimed.length) {
        box.append(el("div", "subhead", "沒有記時間的紀錄"));
        const list = el("div", "entries"); untimed.forEach(e => list.append(entryRow(e))); box.append(list);
      }
      if (des.length) { const canDrag = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
        const tip = el("div", "hint", canDrag ? "點色塊修改；用滑鼠拖曳色塊上下緣可調整時間，拖動整塊可移動；點虛線空檔可補記。" : "點色塊修改時間或內容；點虛線空檔可補記。"); tip.style.marginTop = "6px"; box.append(tip); }
    } else {
      const list = el("div", "entries");
      let prevEnd = null;
      des.forEach(e => {
        if (typeof e.start === "number" && prevEnd != null && e.start - prevEnd >= 5) {
          const gs = prevEnd, ge = e.start;
          const g = el("button", "gaprow", "＋ 空檔 " + hhmm(gs) + "–" + hhmm(ge) + "（" + fmtDur(ge - gs) + "），點此補記"); g.type = "button";
          g.onclick = () => fillGap(gs, ge);
          list.append(g);
        }
        list.append(entryRow(e));
        if (typeof e.end === "number") prevEnd = Math.max(prevEnd ?? 0, e.end);
      });
      box.append(list);
    }

    renderStats();
    renderLedger();
    renderSearch();
    renderReport();
    renderReview();
  }

  let snackTimer = null;
  function snack(msg, undo) {
    $("snackMsg").textContent = msg;
    $("snackUndo").hidden = !undo;
    $("snackUndo").onclick = async () => {
      $("snack").hidden = true; clearTimeout(snackTimer);
      if (undo) await safe(undo, "已復原");
    };
    $("snack").hidden = false;
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => { $("snack").hidden = true; }, 8000);
  }
  async function deleteWithUndo(e) {
    const { id, ...rest } = e;
    let ok = true;
    await safe(() => store.deleteEntry(id).catch(x => { ok = false; throw x; }));
    if (ok) snack("已刪除 " + (typeof e.start === "number" ? hhmm(e.start) + "–" + hhmm(e.end) + " " : "") + labelOf(e), () => store.saveEntry(rest, id));
  }

  function flash(msg) {
    const t = $("toast"); t.textContent = msg; t.dataset.hold = "1";
    clearTimeout(flash.tm); flash.tm = setTimeout(() => { delete t.dataset.hold; render(); }, 2600);
  }
  async function safe(fn, okMsg) {
    try { await fn(); if (okMsg) flash(okMsg); }
    catch (e) {
      const code = e && e.code;
      flash(code === "quota_exceeded" ? "儲存空間已滿，請先刪除一些舊紀錄" :
            code === "invalid_argument" ? "你目前只能檢視，無法修改這份日誌" :
            "沒有存成功，請檢查網路後再按一次");
    }
  }
  function resetForm() {
    state.editingId = null;
    state.form = freshForm(state.form.project);
    $("note").value = "";
  }

  /* ---------- events ---------- */
  function goTab(t) {
    ui.tab = t; saveUi();
    document.querySelectorAll(".page").forEach(p => p.hidden = p.dataset.page !== t);
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    $("dateNav").hidden = !(t === "log" || t === "day");
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => goTab(b.dataset.tab));
  const goDay = ds => { state.day = ds; refreshDefaultTimes(); render(); };
  $("prevDay").onclick = () => goDay(addDays(state.day, -1));
  $("nextDay").onclick = () => goDay(addDays(state.day, 1));
  $("todayBtn").onclick = () => goDay(ymd(new Date()));
  $("runPill").onclick = () => goTab("log");

  $("tStartBtn").onclick = () => safe(() => store.saveTimer({ startAt: Date.now(), project: state.form.project, task: state.form.task }));
  $("tCancelBtn").onclick = () => safe(() => store.saveTimer(null), "已放棄這次計時");
  const stopTimer = async restart => {
    const t = state.timer; if (!t) return;
    const sd = new Date(t.startAt), now = new Date();
    const startDay = ymd(sd);
    let start = minOf(sd), end = minOf(now), crossed = false;
    if (ymd(now) !== startDay) { end = 1439; crossed = true; }
    if (end <= start) end = Math.min(start + 1, 1439);
    if (end <= start) start = end - 1;
    state.editingId = null;
    state.day = startDay;
    state.form = {
      project: state.form.project || t.project || null,
      task: state.form.task || t.task || null,
      start, end, mood: state.form.mood, skip: !!state.form.skip, note: state.form.note, timeTouched: true
    };
    await safe(() => store.saveTimer(restart ? { startAt: Date.now(), project: null, task: null } : null));
    render();
    flash(crossed ? "計時跨過午夜，先記到 23:59，隔天的部分請另外記一筆"
      : "已填入 " + hhmm(start) + "–" + hhmm(end) + (restart ? "，下一段已開始計時。" : "，") + "選好案子和心情後按儲存");
    goTab("log");
  };
  $("tStopBtn").onclick = () => stopTimer(false);
  $("tSwitchBtn").onclick = () => stopTimer(true);

  $("tStart").onchange = e => {
    const v = toMin(e.target.value); if (v == null) return;
    const dur = state.form.end - state.form.start;
    state.form.start = v;
    if (dur > 0) state.form.end = Math.min(v + dur, 1439);
    state.form.timeTouched = true; render();
  };
  $("tEnd").onchange = e => { const v = toMin(e.target.value); if (v == null) return; state.form.end = v; state.form.timeTouched = true; render(); };
  $("qChain").onclick = () => {
    const le = lastEnd(state.day, state.editingId); if (le == null) return;
    const dur = Math.max(15, state.form.end - state.form.start);
    state.form.start = le; state.form.end = Math.min(le + dur, 1439); state.form.timeTouched = true; render();
  };
  $("qNow").onclick = () => {
    const n = nowMin();
    state.form.end = n;
    if (state.form.start >= n) state.form.start = Math.max(0, n - 60);
    state.form.timeTouched = true; render();
  };
  $("mood").oninput = e => { state.form.mood = Number(e.target.value); render(); };
  $("moodSkip").onclick = () => { state.form.skip = !state.form.skip; render(); };
  $("moodMinus").onclick = () => { state.form.mood = Math.max(-10, state.form.mood - 1); render(); };
  $("moodPlus").onclick = () => { state.form.mood = Math.min(10, state.form.mood + 1); render(); };
  $("note").oninput = e => { state.form.note = e.target.value; };
  $("editProjects").onclick = () => { state.editing.projects = !state.editing.projects; state.adding.projects = false; state.pendingRemove = null; state.manageSel = null; render(); };
  $("editTasks").onclick = () => { state.editing.tasks = !state.editing.tasks; state.adding.tasks = false; state.pendingRemove = null; state.manageSel = null; render(); };
  $("cancelEdit").onclick = () => { state.pendingDelete = null; resetForm(); render(); };
  $("delEdit").onclick = async () => {
    const id = state.editingId; if (!id) return;
    if (state.pendingDelete !== id) { state.pendingDelete = id; render(); return; }
    const e = state.entries.find(x => x.id === id);
    state.pendingDelete = null; resetForm(); render();
    if (e) await deleteWithUndo(e);
  };
  const setView = v => { ui.view = v; saveUi(); render(); };
  $("vTimeline").onclick = () => setView("timeline");
  $("vList").onclick = () => setView("list");
  document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => {
    ui.range = b.dataset.range;
    if (ui.range === "custom" && !ui.rFrom) { const r = rangeDates(); ui.rFrom = r.from; ui.rTo = r.to; }
    saveUi(); render();
  });
  $("rFrom").onchange = e => { if (e.target.value) { ui.rFrom = e.target.value; saveUi(); render(); } };
  $("rTo").onchange = e => { if (e.target.value) { ui.rTo = e.target.value; saveUi(); render(); } };
  $("repProj").onchange = e => { ui.repProj = e.target.value; saveUi(); render(); };
  $("repFrom").onchange = e => { if (e.target.value) { ui.repFrom = e.target.value; saveUi(); render(); } };
  $("repTo").onchange = e => { if (e.target.value) { ui.repTo = e.target.value; saveUi(); render(); } };
  $("repExport").onclick = async () => {
    const rows = reportRows(); if (!rows.length || !store.dl) return;
    const { from, to } = reportRange();
    const data = [["案子", "日期", "開始", "結束", "工作項目", "分鐘", "小時", "心情", "備註"]].concat(rows.map(e => [e.project, e.date,
      typeof e.start === "number" ? hhmm(e.start) : "", typeof e.end === "number" ? hhmm(e.end) : "", e.task, e.minutes, fmtH(e.minutes), e.mood, e.note || ""]));
    data.push(["合計", "", "", "", "", rows.reduce((s, e) => s + e.minutes, 0), fmtH(rows.reduce((s, e) => s + e.minutes, 0)), "", ""]);
    try { await store.dl.save({ filename: "工時報表-" + ui.repProj + "-" + from + "_" + to + ".csv", data: csvOf(data) }); } catch (e) {}
  };
  $("wPrev").onclick = () => { state.weekOff = (state.weekOff || 0) - 1; render(); };
  $("wNext").onclick = () => { state.weekOff = Math.min(0, (state.weekOff || 0) + 1); render(); };
  $("aiBtn").onclick = askClaude;
  $("q").oninput = e => { state.query = e.target.value; renderSearch(); };

  $("saveBtn").onclick = async () => {
    const f = state.form;
    if (!((f.skip || (f.project && f.task)) && f.end > f.start)) return;
    const old = state.editingId ? state.entries.find(e => e.id === state.editingId) : null;
    const entry = {
      date: old ? old.date : state.day,
      project: f.project || "", task: f.task || "",
      start: f.start, end: f.end, minutes: f.end - f.start,
      mood: f.skip ? null : f.mood, skip: !!f.skip, ms: 10,
      note: f.note.trim(),
      createdAt: old ? old.createdAt : Date.now()
    };
    const id = state.editingId;
    $("saveBtn").disabled = true;
    state.editingId = null;
    state.form = { project: f.project, task: null, start: entry.end, end: Math.min(entry.end + 60, 1439), mood: 0, skip: false, note: "", timeTouched: false };
    $("note").value = "";
    render();
    await safe(() => store.saveEntry(entry, id),
      (id ? "已更新 " : "已記下 ") + hhmm(entry.start) + "–" + hhmm(entry.end) + " " + labelOf(entry) + (entry.skip ? "（不計入）" : ""));
  };
  $("exportBtn").onclick = async () => {
    const rows = [["日期", "開始", "結束", "案子", "工作項目", "分鐘", "小時", "心情(-10~10)", "備註"]];
    [...state.entries].sort((a, b) => a.date.localeCompare(b.date) || (a.start ?? 9999) - (b.start ?? 9999) || a.createdAt - b.createdAt)
      .forEach(e => rows.push([e.date, typeof e.start === "number" ? hhmm(e.start) : "", typeof e.end === "number" ? hhmm(e.end) : "",
        e.project, e.task, e.minutes, fmtH(e.minutes), e.skip ? "不計入" : e.mood, e.note || ""]));
    const csv = "﻿" + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
    try { await store.dl.save({ filename: "工作日誌-" + ymd(new Date()) + ".csv", data: csv }); } catch (e) {}
  };

  /* ---------- standalone (PWA) helpers: file save / backup / restore ---------- */
  async function saveFile(filename, data, mime) {
    const blob = new Blob([data], { type: mime });
    try {
      const file = new File([blob], filename, { type: mime });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }
  const webDownload = { save: ({ filename, data }) => saveFile(filename, data, /\.json$/i.test(filename) ? "application/json" : "text/csv;charset=utf-8") };

  $("backupBtn").onclick = async () => {
    const payload = { app: "worklog", version: 1, exportedAt: new Date().toISOString(), entries: state.entries, cfg: state.cfg };
    try {
      await saveFile("工作日誌備份-" + ymd(new Date()) + ".json", JSON.stringify(payload), "application/json");
      snack("已匯出備份（" + state.entries.length + " 筆）");
    } catch (e) { snack("備份失敗，請再試一次"); }
  };
  $("restoreBtn").onclick = () => $("restoreFile").click();
  $("restoreFile").onchange = async ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      const o = JSON.parse(await f.text());
      if (!o || o.app !== "worklog" || !Array.isArray(o.entries)) throw new Error("bad backup");
      const list = o.entries.filter(e => e && typeof e.date === "string")
        .map(e => normalize({ ...e, id: e.id || "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }));
      if (!confirm("要用這份備份取代目前的資料嗎？\n目前 " + state.entries.length + " 筆 → 備份 " + list.length + " 筆")) return;
      state.entries = list;
      if (o.cfg) state.cfg = normCfg(o.cfg);
      store.persistLocal();
      resetForm(); refreshDefaultTimes(); render();
      snack("已還原 " + list.length + " 筆紀錄");
    } catch (e) { snack("這不是有效的備份檔"); }
  };

  // keep the "now" line and live block fresh
  setInterval(() => { if (state.day === ymd(new Date()) && document.activeElement && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render(); }, 60000);

  goTab(["log", "day", "stats", "all"].includes(ui.tab) ? ui.tab : "log");
  render();
  initStore();
})();
</script>

<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body></html>
